<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verbal Vocabulary — GRE Study Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=__BUILD_ID__">
</head>
<body class="section-verbal">
<div class="wrap">
<div class="inner">

<div class="topbar">
<a class="home-link" href="index.html">&larr; Home</a>
<div class="pillrow" id="gamify-header"></div>
</div>

<h1 style="font-size:28px;margin-bottom:4px;">Verbal Vocabulary</h1>
<p style="color:var(--ink-soft);margin:0 0 18px 0;font-size:14.5px;">Tap the card to reveal the definition. Mark each word to build a personalized review deck and earn XP.</p>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
<div id="progress-line" style="font-size:13px;color:var(--ink-soft);font-weight:700;"></div>
<div id="deck-pos" style="font-size:13px;color:var(--ink-soft);font-weight:700;"></div>
</div>
<div class="progress-track" style="margin-bottom:26px;"><div class="progress-fill" id="progress-fill" style="width:0%;"></div></div>

<div style="position:relative;">
<div class="burst hidden" id="burst">+5 XP</div>
<button class="flip-outer" id="flip-btn" aria-label="Flip card to reveal the answer">
<div class="flash-card" id="flash-card">
<div class="flip-face front-face">
<div id="front-label" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--section-dark);margin-bottom:16px;font-weight:800;"></div>
<div id="front-main" style="font-family:'Space Grotesk',sans-serif;font-weight:700;line-height:1.2;"></div>
<div id="front-sub" style="color:var(--ink-soft);font-style:italic;margin-top:10px;font-size:15px;"></div>
<div id="tap-hint" style="margin-top:28px;font-size:13px;color:var(--ink-soft);font-weight:600;"></div>
</div>
<div class="flip-face flip-back">
<div id="back-label" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--section-dark);margin-bottom:12px;font-weight:800;"></div>
<div id="back-main" style="font-size:18px;line-height:1.55;"></div>
<div id="back-sub" style="margin-top:18px;font-size:14.5px;color:var(--ink-soft);font-style:italic;"></div>
</div>
</div>
</button>
</div>

<div id="mark-actions" class="hidden" style="display:flex;justify-content:center;gap:14px;margin-top:26px;">
<button class="act-btn bad" id="mark-learning-btn">Still learning</button>
<button class="act-btn good" id="mark-known-btn">Got it! +5 XP</button>
</div>
<div id="mark-hint" style="margin-top:26px;font-size:13.5px;color:var(--ink-soft);text-align:center;font-weight:600;">Click the card to see the answer, then mark it.</div>

<div style="display:flex;justify-content:center;gap:12px;margin-top:34px;flex-wrap:wrap;">
<button class="ctrl-btn" id="prev-btn">&larr; Prev</button>
<button class="ctrl-btn" id="skip-btn">Skip &rarr;</button>
<button class="ctrl-btn" id="shuffle-btn">Shuffle deck</button>
</div>

<div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:24px;">
<input type="checkbox" id="include-known-cb">
<label for="include-known-cb" id="include-known-label" style="font-size:14px;color:var(--ink-soft);font-weight:600;"></label>
</div>

<div style="text-align:center;margin-top:26px;">
<button class="reset-link" id="reset-btn">Reset progress</button>
</div>

</div>
</div>

<script src="js/data.js?v=__BUILD_ID__"></script>
<script src="js/gamify.js?v=__BUILD_ID__"></script>
<script>
  window.FLASHCARDS_CONFIG = {
    cards: VOCAB.map(function (v) { return [v.word, v.pos, v.def, '“' + v.ex + '”']; }),
    storageKey: 'gre_verbal_known',
    unitPlural: 'words',
    frontLabel: 'Word',
    frontMainSize: 38,
    backLabelLower: 'definition'
  };
</script>
<script src="js/flashcards.js?v=__BUILD_ID__"></script>
</body>
</html>
